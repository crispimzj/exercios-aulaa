<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios</title>
    <link rel="stylesheet" href="resources/css/style.css">
    <script src="resources/script/exercício1.js" defer></script>
</head>
<body>

<h4>Exercício 1</h4>
<button id="botao1">Clique aqui</button>

<h4>Exercício 2</h4>
<button id="botao2">Mudar cor de fundo</button>

<h4>Exercício 3</h4>
<input type="number" id="numero1" placeholder="Primeiro número">
<input type="number" id="numero2" placeholder="Segundo número">
<button id="botao3">Verificar</button>
<p id="resultado3"></p>

<h4>Exercício 4</h4>
<input type="number" id="num1" placeholder="Digite o número 1">
<input type="number" id="num2" placeholder="Digite o número 2">
<button id="botao4">Calcular soma</button>
<p id="resultado4"></p>
</section>

<h4>Exercício 5</h4>
<select id="opcoes">
<option value="">Escolha uma cor</option>
<option value="red">Vermelho</option>
<option value="blue">Azul</option>
<option value="green">Verde</option>
</select>

<p id="textoCor">A cor deste texto vai mudar!</p>
</section>

<h4>Exercício 6</h4>
<input type="number" id="numeroParImpar" placeholder="Digite um número">
<button id="botao6">Verificar</button>
<p id="resultado6"></p>
</section>

<h4>Exercício 7 </h4>
       
<input type="text" id="nomeAluno" placeholder="Nome do aluno">
<input type="number" id="nota1" placeholder="Nota 1" min="0" max="10" step="0.1">
<input type="number" id="nota2" placeholder="Nota 2" min="0" max="10" step="0.1">
<input type="number" id="nota3" placeholder="Nota 3" min="0" max="10" step="0.1">
<button id="botao7">Calcular média</button>
<p id="resultado7"></p>
</section>

 <h4>Exercício 8</h4>
<input type="number" id="numeroAntecessor" placeholder="Digite um número">
<button id="botao8">Calcular</button>
<p id="resultado8"></p>
</section>

<h4>Exercício 9 - Contador</h4>
<p id="contador">0</p>
<div class="botoes">
<button id="incrementar">Incrementar +</button>
<button id="decrementar">Decrementar -</button>
</div>
</section>

<h4>Exercício 10</h4>

<input type="number" id="numeroSorteio" placeholder="Digite um número de 1 a 100" min="1" max="100">
<button id="botao10">Sortear número</button>
<p id="resultado10"></p>
</section>

<h4>Exercício 11</h4>

<input type="number" id="peso" placeholder="Peso em kg" step="0.1">
<input type="number" id="altura" placeholder="Altura em metros" step="0.01">

<button type="button" id="botao11">Calcular IMC</button>

<p id="resultado11"></p>

<script src="exercício1.js"></script>
<script src="exercício2.js"></script>

<script src="exercício4.js"></script>

<script src="exercício7.js"></script>
<script src="exercício8.js"></script>
<script src="exercício9.js"></script>
<script src="exercício10.js"></script>
<script src="script.js"></script>

</body>
</html>
